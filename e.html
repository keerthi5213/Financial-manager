<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="stylesheet" href="e.css" />
  <title>Expense Tracker</title>
  <!-- Include Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="header">
    <h1>Expense Tracker</h1>
  </div>
  <div class="container">
    <h4>Your Balance</h4>
    <h1 id="balance">$0.00</h1>

    <div class="inc-exp-container">
      <div>
        <h4>Income</h4>
        <p id="money-plus" class="money plus">+$0.00</p>
      </div>
      <div>
        <h4>Expense</h4>
        <p id="money-minus" class="money minus">-$0.00</p>
      </div>
    </div>

    <h3>History</h3>
    <ul id="list" class="list"></ul> <!-- Dynamically populated -->

   
    <h4>Add new transaction</h4>
    <form id="form">
      <div class="form-control">
        <label for="text">Text</label>
        <input type="text" id="text" placeholder="Enter text..." />
      </div>
      <div class="form-control">
        <label for="amount">Amount (negative - expense, positive - income)</label>
        <input type="number" id="amount" placeholder="Enter amount..." />
      </div>
      <button class="btn">Add transaction</button>
    </form>
    
    <!-- Customizable Reports Section -->
    <h3>Generate Custom Report</h3>
    <form id="report-form">
      <div class="form-control">
        <label for="time-period">Select Time Period</label>
        <select id="time-period">
          <option value="all">All Time</option>
          <option value="week">This Week</option>
          <option value="month">This Month</option>
        </select>
      </div>
      <div class="form-control">
        <label for="transaction-type">Transaction Type</label>
        <select id="transaction-type">
          <option value="both">Both</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>
      <div class="form-control">
        <label for="chart-type">Chart Type</label>
        <select id="chart-type">
          <option value="bar">Bar Chart</option>
          <option value="pie">Pie Chart</option>
          <option value="line">Line Chart</option>
        </select>
      </div>
      <button type="submit" class="btn">Generate Report</button>
    </form>
    <h3>Chart Visualizations</h3>
    <div>
      <canvas id="income-expense-chart"></canvas> <!-- Chart Container -->
    </div>


    <br><br>
    <button id="download-chart" class="btn">Download Chart as Image</button>
    <br><br>
    <a href="index.html">HOME</a>
  </div>

  <script>
    // Initialize an array to store transactions
    let transactions = [];

    // DOM elements
    const balance = document.getElementById('balance');
    const incomeDisplay = document.getElementById('money-plus');
    const expenseDisplay = document.getElementById('money-minus');
    const transactionList = document.getElementById('list');
    const form = document.getElementById('form');
    const textInput = document.getElementById('text');
    const amountInput = document.getElementById('amount');
    const incomeExpenseChart = document.getElementById('income-expense-chart').getContext('2d');
    const reportForm = document.getElementById('report-form');
    const downloadBtn = document.getElementById('download-chart');

    // Initialize Chart.js
    let chart = new Chart(incomeExpenseChart, {
      type: 'bar',
      data: {
        labels: ['Income', 'Expense'],
        datasets: [{
          label: 'Amount',
          data: [0, 0],  // Initial income and expense data
          backgroundColor: ['#4caf50', '#f44336'],
        }],
      },
      options: {
        scales: {
          y: {
            beginAtZero: true,
          },
        },
      },
    });

    // Function to calculate the balance and render UI
    function updateUI() {
      const totalIncome = transactions
        .filter(transaction => transaction.amount > 0)
        .reduce((acc, transaction) => acc + transaction.amount, 0);

      const totalExpense = transactions
        .filter(transaction => transaction.amount < 0)
        .reduce((acc, transaction) => acc + transaction.amount, 0);

      const totalBalance = totalIncome + totalExpense;

      balance.textContent = `$${totalBalance.toFixed(2)}`;
      incomeDisplay.textContent = `+$${totalIncome.toFixed(2)}`;
      expenseDisplay.textContent = `-$${Math.abs(totalExpense).toFixed(2)}`;

      transactionList.innerHTML = '';
      transactions.forEach((transaction, index) => {
        const listItem = document.createElement('li');
        listItem.classList.add(transaction.amount < 0 ? 'minus' : 'plus');
        
        // Format the date to display in a readable way
        const formattedDate = new Date(transaction.date).toLocaleDateString();

        listItem.innerHTML = `${transaction.text} <span>${transaction.amount < 0 ? '-' : '+'}$${Math.abs(transaction.amount).toFixed(2)}</span> <small>(${formattedDate})</small><button class="delete-btn" onclick="deleteTransaction(${index})">x</button>`;
        transactionList.appendChild(listItem);
      });

      // Update the chart with the latest data
      chart.data.datasets[0].data = [totalIncome, Math.abs(totalExpense)];
      chart.update();
    }

    // Add transaction
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const text = textInput.value.trim();
      const amount = parseFloat(amountInput.value.trim());

      if (text && !isNaN(amount)) {
        const transaction = {
          text,
          amount,
          date: new Date(),
        };

        transactions.push(transaction);
        textInput.value = '';
        amountInput.value = '';
        saveToLocalStorage();
        updateUI();
      }
    });

    // Delete transaction
    function deleteTransaction(index) {
      transactions.splice(index, 1);
      saveToLocalStorage();
      updateUI();
    }

    // Save transactions to localStorage
    function saveToLocalStorage() {
      localStorage.setItem('transactions', JSON.stringify(transactions));
    }

    // Load transactions from localStorage
    function loadFromLocalStorage() {
      const storedTransactions = localStorage.getItem('transactions');
      if (storedTransactions) {
        transactions = JSON.parse(storedTransactions);
        updateUI();
      }
    }

    // Load data when the page loads
    loadFromLocalStorage();

    // Handle customizable report generation
    reportForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const timePeriod = document.getElementById('time-period').value;
      const transactionType = document.getElementById('transaction-type').value;
      const chartType = document.getElementById('chart-type').value;

      // Filter transactions based on selected time period
      let filteredTransactions = transactions;

      const currentDate = new Date();
      if (timePeriod === 'week') {
        filteredTransactions = filteredTransactions.filter(transaction => {
          const transactionDate = new Date(transaction.date);
          return transactionDate >= new Date(currentDate.setDate(currentDate.getDate() - 7));
        });
      } else if (timePeriod === 'month') {
        filteredTransactions = filteredTransactions.filter(transaction => {
          const transactionDate = new Date(transaction.date);
          return transactionDate.getMonth() === currentDate.getMonth() && transactionDate.getFullYear() === currentDate.getFullYear();
        });
      }

      // Filter based on transaction type (income, expense, or both)
      if (transactionType !== 'both') {
        const filterAmount = transactionType === 'income' ? 1 : -1;
        filteredTransactions = filteredTransactions.filter(transaction => Math.sign(transaction.amount) === filterAmount);
      }

      // Calculate total income and expense for the filtered data
      const totalIncome = filteredTransactions
        .filter(transaction => transaction.amount > 0)
        .reduce((acc, transaction) => acc + transaction.amount, 0);

      const totalExpense = filteredTransactions
        .filter(transaction => transaction.amount < 0)
        .reduce((acc, transaction) => acc + transaction.amount, 0);

      // Update chart type based on user selection
      chart.config.type = chartType;
      chart.data.datasets[0].data = [totalIncome, Math.abs(totalExpense)];
      chart.update();
    });

    // Download chart as an image
    downloadBtn.addEventListener('click', () => {
      const imageUrl = chart.toBase64Image();
      const link = document.createElement('a');
      link.href = imageUrl;
      link.download = 'expense_report.png';
      link.click();
    });
  </script>
</body>
</html>
