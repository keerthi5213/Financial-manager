
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INCAL BOOK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Recursive:wght@300..1000&display=swap');


        body {
            margin: 0;
            padding: 0;
            background-color: #c0bfbe;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
        }

        .navi {
            background-color: #adabab;
            color: white;
            margin: 0;
            height: 80px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            padding: 0px;
            color: rgb(36, 34, 34);
            margin: 0;
            /* Remove any default margin */
        }

        .options {
            margin-top: 20px;
            /* Adjust margin-top to your liking */
            height: auto;
            width: 100%;
            /* Make width 100% of the viewport */
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color:  #e0e0e0;
            border-radius: 20px;
            border: 4px solid #3e3e3e;
            box-shadow: 0px 5px 15px 0px rgba(0, 0, 0, 0.3);
            padding: 20px;
            box-sizing: border-box;
        }

        .options>a {
            text-decoration: none;
            color: white;
            background-color: #020202;
            padding: 10px 20px;
            margin: 10px;
            font-size: 25px;
            border-radius: 10px;
            border: 3px solid #000000;
            transition: all 0.3s ease;
        }

        .options>a:hover {
            background-color:#727272;
            font-size: 30px;
        }

        p {
            text-align: center;
            margin-top: 20px;
        }

        @media(max-width:600px) {
            .navi {
                height: 110px;
            }

            h1 {
                font-size: 24px;
                /* Adjust font size for smaller screens */
            }

            .options {
                padding: 10px;
                /* Adjust padding for smaller screens */
            }

            .options>a {
                font-size: 20px;
                /* Adjust font size for smaller screens */
                padding: 8px 16px;
                /* Adjust padding for smaller screens */
                margin: 8px;
                /* Adjust margin for smaller screens */
            }

            p {
                font-size: 14px;
                /* Adjust font size for smaller screens */
            }
        }
    </style>
</head>

<body>
    <div class="navi">
        <h1>INCAL BOOK</h1>
    </div>
    <div class="options">
        <a href="interestcal.html">interest cal</a>
        <a href="saved.html">saved records</a>
        <a href="\cc.html">Currency Converter</a>
        <a href="index.html">BACK</a>
    
    </div>
    
</body>

</html>
